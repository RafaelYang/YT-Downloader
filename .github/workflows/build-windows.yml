name: Build Windows preview

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease tag to receive the installer
        required: true
        default: v0.1.6-dev
        type: string
      publish_release:
        description: Attach the verified installer to the private GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-windows-x64:
    name: Windows 10/11 x64 installer
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt

      - name: Fetch and verify pinned Windows runtimes
        shell: pwsh
        run: ./scripts/fetch_windows_runtime.ps1

      - name: Run source tests
        shell: pwsh
        run: |
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile app.py desktop_app.py desktop_config.py desktop_platform.py whisper_model_manager.py translation_model_manager.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check static/app.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows application
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $Executable = (Resolve-Path "dist\YT Downloader by 學人新創\YT Downloader by 學人新創.exe").Path
          $env:YT_DATA_DIR = Join-Path $env:RUNNER_TEMP "yt-downloader-smoke-data"
          $env:YT_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP "yt-downloader-smoke-output"
          $LogPath = Join-Path $env:YT_DATA_DIR "logs\desktop.log"

          $AiCheck = Start-Process -FilePath $Executable -ArgumentList "--ai-runtime-check" -Wait -PassThru
          if ($AiCheck.ExitCode -ne 0) {
            if (Test-Path $LogPath) {
              Get-Content -Path $LogPath -Tail 200
            }
            throw "Packaged AI transcript dependencies are incomplete (exit code $($AiCheck.ExitCode))."
          }

          function Show-AppDiagnostics {
            Write-Host "--- packaged app processes ---"
            Get-Process | Where-Object { $_.ProcessName -match "YT Downloader|node" } | Format-Table -AutoSize | Out-String | Write-Host
            Write-Host "--- packaged app log ---"
            if (Test-Path $LogPath) {
              Get-Content -Path $LogPath -Tail 200
            }
            else {
              Write-Host "No desktop.log was created."
            }
          }

          $Process = Start-Process -FilePath $Executable -ArgumentList @("--background", "--no-tray") -PassThru
          $Healthy = $false
          try {
            for ($Attempt = 0; $Attempt -lt 120; $Attempt++) {
              if ($Process.HasExited) {
                Show-AppDiagnostics
                throw "Packaged application exited before its local API became healthy."
              }
              try {
                $Response = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/health" -TimeoutSec 2
                if ($Response.status -eq "ok" -and $Response.product -eq "YT Downloader by 學人新創") {
                  $Healthy = $true
                  break
                }
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $Healthy) {
              Show-AppDiagnostics
              throw "Packaged application did not become healthy within 60 seconds."
            }
            Write-Host "Packaged Windows local API is healthy."
          }
          finally {
            if (-not $Process.HasExited) {
              & taskkill.exe /PID $Process.Id /T /F | Out-Null
            }
          }

      - name: Build current-user installer
        shell: pwsh
        run: |
          ./scripts/fetch_inno_language.ps1

          $Compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $Compiler)) {
            throw "Inno Setup compiler is unavailable on the Windows runner."
          }
          & $Compiler "packaging\windows-x64.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed."
          }

          $Installer = (Resolve-Path "dist\installer\YT-Downloader-0.1.6-dev-Windows-x64-Setup.exe").Path
          $Hash = (Get-FileHash -Path $Installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $Checksum = Join-Path (Split-Path -Parent $Installer) "SHA256SUMS-windows.txt"
          [System.IO.File]::WriteAllText(
            $Checksum,
            "$Hash  $([System.IO.Path]::GetFileName($Installer))`n",
            [System.Text.Encoding]::ASCII
          )
          Write-Host "installer=$Installer"
          Write-Host "sha256=$Hash"

      - name: Smoke-test installer lifecycle
        shell: pwsh
        run: |
          $Installer = (Resolve-Path "dist\installer\YT-Downloader-0.1.6-dev-Windows-x64-Setup.exe").Path
          $InstallDir = Join-Path $env:RUNNER_TEMP "yt-downloader-installed"
          $Executable = Join-Path $InstallDir "YT Downloader by 學人新創.exe"
          $env:YT_DATA_DIR = Join-Path $env:RUNNER_TEMP "yt-downloader-installer-smoke-data"
          $env:YT_OUTPUT_DIR = Join-Path $env:RUNNER_TEMP "yt-downloader-installer-smoke-output"

          function Get-LoginStartupValue {
            $Key = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
              "Software\Microsoft\Windows\CurrentVersion\Run"
            )
            if ($null -eq $Key) {
              return $null
            }
            try {
              return $Key.GetValue("YT Downloader by 學人新創", $null)
            }
            finally {
              $Key.Dispose()
            }
          }

          function Set-LegacyLoginStartupValue {
            $Key = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey(
              "Software\Microsoft\Windows\CurrentVersion\Run"
            )
            try {
              $Key.SetValue(
                "YT Downloader by 學人新創",
                "`"$Executable`" --background",
                [Microsoft.Win32.RegistryValueKind]::String
              )
            }
            finally {
              $Key.Dispose()
            }
          }

          $Install = Start-Process -FilePath $Installer -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$InstallDir"
          ) -Wait -PassThru
          if ($Install.ExitCode -ne 0 -or -not (Test-Path $Executable)) {
            throw "Silent current-user installation failed with exit code $($Install.ExitCode)."
          }

          Set-LegacyLoginStartupValue
          if ($null -eq (Get-LoginStartupValue)) {
            throw "The legacy current-user login startup fixture was not created."
          }

          $Process = Start-Process -FilePath $Executable -ArgumentList @("--background", "--no-tray") -PassThru
          $Healthy = $false
          try {
            for ($Attempt = 0; $Attempt -lt 120; $Attempt++) {
              if ($Process.HasExited) {
                throw "Installed application exited before its local API became healthy."
              }
              try {
                $Response = Invoke-RestMethod -Uri "http://127.0.0.1:18765/api/health" -TimeoutSec 2
                if ($Response.status -eq "ok" -and $Response.product -eq "YT Downloader by 學人新創") {
                  $Healthy = $true
                  break
                }
              }
              catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $Healthy) {
              throw "Installed application did not become healthy within 60 seconds."
            }
            Write-Host "Installed Windows application is healthy."

            $RemainingRunValue = Get-LoginStartupValue
            if ($null -ne $RemainingRunValue) {
              throw "Legacy login startup remained after the packaged application launched: $RemainingRunValue"
            }
            Write-Host "Packaged launch removed legacy login startup and did not recreate it."
          }
          finally {
            if (-not $Process.HasExited) {
              & taskkill.exe /PID $Process.Id /T /F | Out-Null
            }
          }

          $Uninstaller = Join-Path $InstallDir "unins000.exe"
          if (-not (Test-Path $Uninstaller)) {
            throw "The installer did not create an uninstaller."
          }
          $Uninstall = Start-Process -FilePath $Uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($Uninstall.ExitCode -ne 0) {
            throw "Silent uninstallation failed with exit code $($Uninstall.ExitCode)."
          }
          for ($Attempt = 0; $Attempt -lt 20 -and (Test-Path $InstallDir); $Attempt++) {
            Start-Sleep -Milliseconds 500
          }
          if (Test-Path $InstallDir) {
            throw "Uninstallation left the application install directory behind."
          }
          Write-Host "Windows installer install/start/uninstall lifecycle passed."

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: YT-Downloader-0.1.6-dev-Windows-x64
          path: |
            dist/installer/YT-Downloader-0.1.6-dev-Windows-x64-Setup.exe
            dist/installer/SHA256SUMS-windows.txt
          compression-level: 0
          if-no-files-found: error

      - name: Attach installer to private prerelease
        if: ${{ inputs.publish_release }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view $env:RELEASE_TAG
          gh release upload $env:RELEASE_TAG `
            "dist\installer\YT-Downloader-0.1.6-dev-Windows-x64-Setup.exe#Windows 10/11 x64 安裝程式" `
            --clobber
